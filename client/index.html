<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Removed maximum-scale=1 — blocking zoom is a WCAG 1.4.4
         (Resize Text) violation. Mobile users with low vision rely on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>LeadMarket — Verified Insurance Lead Marketplace</title>

    <!-- Indexable SEO description. Critical for Google snippet rendering. -->
    <meta name="description" content="Buy verified Medicare, ACA, and Final Expense leads with full provenance, TCPA-safe outreach, smart-match scoring, and replacement credits for bad contact info." />
    <meta name="theme-color" content="#1a56db" />

    <!-- Open Graph for Slack / LinkedIn / Facebook unfurls. -->
    <meta property="og:title" content="LeadMarket — Verified Insurance Lead Marketplace" />
    <meta property="og:description" content="The trusted marketplace for verified Medicare, ACA, and Final Expense leads. Full provenance, smart-match scoring, and replacement credits when contact info doesn't pan out." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LeadMarket" />
    <meta property="og:url" content="https://leadmarket.app" />
    <meta property="og:image" content="/opengraph.jpg" />

    <!-- Twitter / X card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LeadMarket — Verified Insurance Lead Marketplace" />
    <meta name="twitter:description" content="Buy verified Medicare, ACA, and Final Expense leads with full provenance and replacement credits." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- iOS Safari and some Android browsers auto-style anything that
         looks like a phone number (10 digits, parens, dashes) as a
         tap-to-call link. The marketplace lists hundreds of consumer
         phone numbers as data, and the auto-styling either makes them
         look broken (blue underline through a tabular cell) or invites
         an accidental tap that fires a TCPA-unsafe call before the
         agent has opened the lead's dial workflow. format-detection
         opts the whole app out. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- DNS prefetch for the GA / Google Tag Manager origin is
         intentionally NOT inlined here. Doing so would fire a DNS
         query against www.googletagmanager.com on every page load —
         even in dev / CI where GA is disabled, even for prod users
         whose VITE_GA_MEASUREMENT_ID is unset. That's a third-party
         leak we don't want to make unconditionally. The hint is
         instead injected by client/src/lib/ga.ts at the same time
         it creates the gtag script tag, so it only fires when GA
         is actually enabled. -->

    <!-- Google Analytics 4 is booted from client/src/lib/ga.ts when the
         VITE_GA_MEASUREMENT_ID env var holds a real G-XXXXXXXXXX id. The
         old inline snippet here hard-coded a placeholder that pinged a
         non-existent property on every dev + CI page load. -->

    <!-- Fonts: Plus Jakarta Sans (Headings), Inter (UI/Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Show a friendly message when JS is disabled instead of a blank page. -->
    <noscript>
      <div style="padding:2rem;max-width:600px;margin:4rem auto;font-family:system-ui,sans-serif;text-align:center">
        <h1 style="font-size:1.5rem;margin-bottom:1rem">LeadMarket requires JavaScript</h1>
        <p style="color:#666">Please enable JavaScript in your browser to use the marketplace.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
